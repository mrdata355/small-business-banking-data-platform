name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"
      - name: Repository-wide syntax and contract validation
        run: python scripts/validate_repository.py
      - name: Strict lint core runtime
        run: ruff check src tests scripts
      - name: Correctness lint platform extensions
        run: ruff check agents digital_twin collaboration enterprise --select E9,F821,F822,F823
      - name: Unit and integration tests
        run: pytest -q
      - name: Run complete local data platform
        run: python scripts/run_all.py
      - name: Render pipeline evidence
        run: python scripts/show_results.py
      - name: Publish pipeline evidence
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: runtime/lake/
          retention-days: 30

resources:
  pipelines:
    lending_bronze:
      name: oakbridge-lending-bronze-${bundle.target}
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze_lending.name}
      serverless: true
      development: true
      continuous: false
      libraries:
        - file:
            path: ../src/oakbridge/lakeflow/lending_bronze.py
      configuration:
        oakbridge.catalog: ${var.catalog}
        oakbridge.demo.lending_rps: "5"
        pipelines.metrics.flowTimeReporter.enabled: "true"

    lending_silver:

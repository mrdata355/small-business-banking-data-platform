name: oakbridge_analytics
version: '1.0.0'
config-version: 2
profile: oakbridge_analytics
model-paths: ['models']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']
clean-targets: ['target', 'dbt_packages']

models:
  oakbridge_analytics:
    staging:
      +materialized: view
      +schema: stg
    core:
      +materialized: incremental
      +incremental_strategy: merge
      +schema: core
    marts:
      +materialized: table
      +schema: marts
    semantic:
      +materialized: view
      +schema: semantic
